<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Memory Match (Demo)</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="topbar">
    <div class="brand">🧠 Memory Match <span class="badge">DEMO</span></div>
  </div>

  <div class="container narrow">
    <div class="card controls-card">
      <div class="form-row">
        <label>Difficulty</label>
        <select id="difficulty">
          <option value="4x4">Easy (4×4)</option>
          <option value="4x6">Medium (4×6)</option>
          <option value="6x6">Hard (6×6)</option>
        </select>
        <button id="btn-new">New Game</button>
      </div>
      <div class="stat-row">
        <div>⏱ Time: <strong id="timer">0s</strong></div>
        <div>🔁 Moves: <strong id="moves">0</strong></div>
        <div>🏆 Best: <strong id="best">—</strong></div>
      </div>
    </div>

    <div id="board" class="board"></div>

    <div id="win-banner" class="win-banner" style="display:none;">
      🎉 Solved in <span id="win-moves"></span> moves, <span id="win-time"></span>! <span id="win-best"></span>
    </div>
  </div>

  <div class="app-footer">
    Demo project by <strong>Hassan Ansari</strong> ·
    <a href="https://github.com/iam-hassan-ansari" target="_blank" rel="noopener">GitHub</a>
  </div>

  <script src="app.js"></script>
</body>
</html>
